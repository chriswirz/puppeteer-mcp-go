name: build-and-publish

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version is computed once and consumed by every later job, so the
  # binary's -version output, the package metadata and the release tag cannot
  # drift apart. v0.1.<run number, four digits>: monotonic, sortable, and it
  # says which run produced a binary without consulting anything.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      number: ${{ steps.compute.outputs.number }}
    steps:
      - id: compute
        run: |
          number="$(printf '%04d' "${{ github.run_number }}")"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "version=0.1.${number}" >> "$GITHUB_OUTPUT"
          echo "building v0.1.${number}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

      # The end-to-end tests drive a real headless Chromium. They are the only
      # thing that proves the tools work rather than merely compile, so the
      # driver is installed and they are run for real.
      # The playwright.azureedge.net CDN pinned inside playwright-go v0.6000.0
      # was retired and now 404s, and Microsoft's own cdn.playwright.dev mirror
      # rejects these driver requests with a 400, so downloads are pointed at
      # the npmmirror binary mirror, which carries both the driver zips and the
      # matching chromium builds under the same layout.
      - name: Install the Playwright browser
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.6000.0 install --with-deps chromium
      - name: End-to-end tests
        env:
          PUPPETEER_MCP_E2E: "1"
        run: go test -run E2E -v ./...

  build:
    needs: [version, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="puppeteer-mcp-${GOOS}-${GOARCH}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}" .
      - uses: actions/upload-artifact@v4
        with:
          name: puppeteer-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: puppeteer-mcp-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build .deb and .rpm
        env:
          ARCH: ${{ matrix.arch }}
          PKG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "dist/puppeteer-mcp-linux-${ARCH}" packaging/puppeteer-mcp
          chmod +x packaging/puppeteer-mcp
          mkdir -p out
          nfpm package -f packaging/nfpm.yaml -p deb -t out/
          nfpm package -f packaging/nfpm.yaml -p rpm -t out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: puppeteer-mcp-packages-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect binaries
        run: |
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "puppeteer-mcp v${VERSION}" \
            --notes "Automated build of \`${{ github.sha }}\` from \`${{ github.ref_name }}\`." \
            --latest
